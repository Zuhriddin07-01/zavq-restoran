<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Boshqaruv paneli{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2c3e50;
            --primary-dark: #1a252f;
            --dark: #1e1e1e;
            --bg: #f4f6f8;
            --card: #ffffff;
            --success: #27ae60;
            --warning: #f39c12;
            --danger: #c0392b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg);
            color: #333;
        }
        h1, h2, .logo { font-family: 'Playfair Display', serif; }

        .staff-navbar {
            background: var(--dark);
            padding: 16px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .staff-navbar .logo {
            color: #fff;
            font-size: 20px;
            font-weight: 700;
            text-decoration: none;
        }
        .staff-navbar .badge {
            background: var(--primary);
            color: white;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 11px;
            margin-left: 10px;
            font-family: 'Poppins', sans-serif;
            vertical-align: middle;
        }
        .staff-navbar .links a, .staff-navbar .links button {
            color: #ccc;
            text-decoration: none;
            margin-left: 20px;
            font-size: 14px;
            font-weight: 500;
            background: none;
            border: none;
            cursor: pointer;
            font-family: inherit;
        }
        .staff-navbar .links a:hover, .staff-navbar .links button:hover { color: var(--warning); }

        .content { min-height: 80vh; }

        .btn {
            display: inline-block;
            background: var(--primary);
            color: white;
            padding: 10px 22px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            text-decoration: none;
        }
        .btn:hover { background: var(--primary-dark); }
    </style>
</head>
<body>
    <nav class="staff-navbar">
        <a href="{% url 'staff_orders' %}" class="logo">👨‍🍳 Zavq Restoran <span class="badge">STAFF</span></a>
        <div class="links">
            <a href="{% url 'menu_list' %}">← Mijozlar saytiga</a>
            <form method="POST" action="{% url 'logout' %}" style="display:inline;">
                {% csrf_token %}
                <button type="submit">🚪 Chiqish ({{ user.username }})</button>
            </form>
        </div>
    </nav>

    <div class="content">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
