{% extends 'base.html' %}

{% block title %}Kirish{% endblock %}

{% block content %}
<style>
    .auth-box {
        background: var(--card);
        max-width: 360px;
        margin: 60px auto;
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 6px 20px rgba(0,0,0,0.1);
    }
    .auth-box h1 {
        text-align: center;
        font-size: 26px;
        margin-bottom: 24px;
        color: var(--dark);
    }
    .form-group { margin-bottom: 16px; }
    .form-group label {
        display: block;
        margin-bottom: 6px;
        font-size: 13px;
        color: #777;
        font-weight: 600;
    }
    .form-group input {
        width: 100%;
        padding: 11px 14px;
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        font-family: inherit;
        font-size: 14px;
    }
    .form-group input:focus {
        outline: none;
        border-color: var(--primary);
    }
    .auth-box button {
        width: 100%;
        padding: 14px;
        font-size: 15px;
        margin-top: 8px;
    }
    .errors {
        background: #f8d7da;
        color: #721c24;
        padding: 10px 14px;
        border-radius: 8px;
        font-size: 13px;
        margin-bottom: 16px;
    }
    .switch-link {
        text-align: center;
        margin-top: 18px;
        font-size: 14px;
        color: #777;
    }
    .switch-link a { color: var(--primary); font-weight: 600; text-decoration: none; }
</style>

<div class="auth-box">
    <h1>🔐 Tizimga kirish</h1>

    {% if form.errors %}
        <div class="errors">Login yoki parol noto'g'ri!</div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label>Login</label>
            {{ form.username }}
        </div>
        <div class="form-group">
            <label>Parol</label>
            {{ form.password }}
        </div>
        <button type="submit" class="btn">Kirish</button>
    </form>

    <div class="switch-link">
        Hisobingiz yo'qmi? <a href="{% url 'register' %}">Ro'yxatdan o'ting</a>
    </div>
</div>
{% endblock %}
